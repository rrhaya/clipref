name: ShellCheck
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: shellcheck --shell=bash bin/clipref install.sh packaging/homebrew/prepare-formula.sh
